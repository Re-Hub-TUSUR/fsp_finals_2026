services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sportikus-postgres
    restart: always
    environment:
      POSTGRES_DB: sportikus
      POSTGRES_USER: sportikus_user
      POSTGRES_PASSWORD: sportikus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportikus_user -d sportikus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportikus-redis
    restart: always
    # Только кэш: без сохранения на диск, память ограничена, лишнее вытесняется
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportikus-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sportikus
      SPRING_DATASOURCE_USERNAME: sportikus_user
      SPRING_DATASOURCE_PASSWORD: sportikus_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      UPLOAD_DIR: /app/uploads
      # Автопроверка мероприятий через RouterAI: ключ берётся из .env рядом с docker-compose.yml
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      MODERATION_LLM_MODEL: ${MODERATION_LLM_MODEL:-yandex/aliceai-llm-flash}
    volumes:
      - profile_uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_2GIS_KEY: ${VITE_2GIS_KEY:-}
        VITE_2GIS_STYLE_ID: ${VITE_2GIS_STYLE_ID:-}
        VITE_2GIS_STYLE_ID_DARK: ${VITE_2GIS_STYLE_ID_DARK:-}
    container_name: sportikus-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  profile_uploads:
