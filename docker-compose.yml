version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sportikus-postgres
    restart: always
    environment:
      POSTGRES_DB: sportikus
      POSTGRES_USER: sportikus_user
      POSTGRES_PASSWORD: sportikus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportikus_user -d sportikus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportikus-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sportikus
      SPRING_DATASOURCE_USERNAME: sportikus_user
      SPRING_DATASOURCE_PASSWORD: sportikus_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      UPLOAD_DIR: /app/uploads
    volumes:
      - profile_uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_2GIS_KEY: ${VITE_2GIS_KEY:-}
        VITE_2GIS_STYLE_ID: ${VITE_2GIS_STYLE_ID:-}
        VITE_2GIS_STYLE_ID_DARK: ${VITE_2GIS_STYLE_ID_DARK:-}
    container_name: sportikus-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  profile_uploads:
