[project]
site_name = "Sportikus — документация"
site_description = "Документация платформы спортивных активностей Sportikus: продукт, сценарии, покрытие ТЗ и устройство системы."
site_author = "Sportikus"
copyright = """
Copyright &copy; 2026 Команда Sportikus
"""

nav = [
    { "Главная" = "index.md" },
    { "Продукт" = [
        { "Обзор продукта" = "product/overview.md" },
        { "Карта страниц" = "product/pages.md" },
        { "Акторы и демо-аккаунты" = "actors/personas.md" },
        { "Use cases" = [
            { "Каталог" = "use-cases/index.md" },
            { "Пользователь" = "use-cases/user.md" },
            { "Организатор" = "use-cases/organizer.md" },
            { "Администратор" = "use-cases/admin.md" },
        ]},
        { "User flows" = "user-flows/index.md" },
    ]},
    { "Бизнес" = [
        { "Покрытие ТЗ" = "business/coverage.md" },
        { "Нефункциональные требования" = "business/nfr.md" },
    ]},
    { "Инженерия" = [
        { "Обзор" = "technical/index.md" },
        { "Архитектура" = "technical/architecture.md" },
        { "Клиент" = "technical/frontend.md" },
        { "Модель данных" = "technical/data-model.md" },
        { "API" = "technical/api.md" },
        { "Конструктор мероприятий" = "technical/constructor.md" },
        { "Рекомендательная система" = "technical/recommendations.md" },
        { "Автопроверка мероприятий" = "technical/moderation.md" },
        { "PWA" = "technical/pwa.md" },
        { "Локальный запуск" = "technical/local-start.md" },
        { "Тестирование" = "technical/testing.md" },
        { "Ограничения и развитие" = "technical/limitations.md" },
    ]},
    { "Глоссарий" = "glossary.md" },
]

[project.theme]
language = "ru"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Тёмная тема"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Светлая тема"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
