server:
  port: 8080

spring:
  application:
    name: sportikus-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportikus}
    username: ${SPRING_DATASOURCE_USERNAME:sportikus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sportikus_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    # Теги идут в логическом порядке из OpenApiConfig, операции — по HTTP-методу
    operations-sorter: method
    doc-expansion: none
    persist-authorization: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours

features:
  location-sharing:
    enabled: false

# Рекомендации: веса и лимиты можно менять без пересборки (см. RecommendationProperties)
recommendations:
  default-radius-km: 25
  horizon-days: 30
  candidates-per-source: 300
  cache-ttl: PT2M
  max-same-sport-in-row: 2
  affinity-half-life-days: 90
  # На масштабе страны порог поддержки стоит поднять до десятков пользователей
  similarity-min-score: 0.2
  similarity-min-cooccurrence: 2
  weights:
    interest: 0.35
    distance: 0.20
    affinity: 0.15
    urgency: 0.10
    skill: 0.08
    social: 0.07
    organizer: 0.05
    time: 0.05
    dislike-penalty: 0.30
  jobs:
    enabled: true
    popularity-refresh: PT5M
    nightly-cron: "0 30 3 * * *"
